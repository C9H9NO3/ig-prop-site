<!doctype html>
<!-- html/body start BLACK (inline, so it holds from the very first paint): during
     PWA launch iOS paints the page background in areas no element covers yet (the
     gray strip under the home indicator). Black = invisible against the splash.
     The splash-removal script restores the app tone afterwards. -->
<html lang="en" style="background:#000">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest_new.json?v=71">
<link rel="apple-touch-icon" href="icon.png?v=71">
<!-- native iOS launch images: iOS shows these INSTANTLY on tap (before our HTML
     loads), killing the system gray phase. Pixel-identical to the in-page splash. -->
<link rel="apple-touch-startup-image" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="launch_1290x2796.png?v=71">
<link rel="apple-touch-startup-image" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="launch_1179x2556.png?v=71">
<title>Instagram</title>
<script src="config.js?v=71"></script>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update());
  // deploy landed while we were serving the cached shell: reload silently, but only
  // in the first moment after open (reload serves instantly from cache; no loop -
  // the reloaded copy matches the network so no second notification fires)
  navigator.serviceWorker.addEventListener('message',(e)=>{
    if(e.data&&e.data.type==='shell-updated'&&performance.now()<1200)location.reload();
  });
}
</script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    scrollbar-width:none;-ms-overflow-style:none;}
  ::-webkit-scrollbar{display:none;width:0;height:0;}   /* IG never shows scrollbars */
  /* NORMAL-FLOW document (the working-reference pattern): min-height:100dvh, the page
     flows; we do NOT lock with position:fixed/height:100dvh/overflow:hidden (that was
     fighting iOS's safe-area placement and leaving the on-device bottom gap). */
  html{background:#0d1115;-webkit-text-size-adjust:100%;}
  body{background:#0d1115;min-height:100dvh;overflow-x:hidden;
       font-family:-apple-system,"SF Pro Text",sans-serif;touch-action:manipulation;}
  img,video{-webkit-user-drag:none;}
  #app{position:relative;min-height:100dvh;background:#0d1115;overflow-x:hidden;}
  #stage{position:relative;min-height:100dvh;background:#0d1115;}

  /* one screen visible at a time; the active screen flows (sets the document height) */
  .screen{display:none;width:100%;background:#0d1115;position:relative;}
  .screen.active{display:block;}
  .screen.animating{position:absolute;top:0;left:0;z-index:50;}  /* only during a transition */
  /* nav screens reserve the home-indicator zone (dark) below the nav, like the
     reference's env(safe-area-inset-bottom) padding -> nav clears the indicator */
  .screen.navpad{padding-bottom:env(safe-area-inset-bottom,0px);}

  .sheet{position:relative;width:100%;}
  .sheet > img{display:block;width:100%;height:auto;position:relative;z-index:1;}
  video.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#0d1115;z-index:0;}
  .hot{position:absolute;background:transparent;z-index:5;}
  /* live profile stat numbers drawn from real harvested digit-images */
  #profileStats{position:absolute;inset:0;z-index:3;pointer-events:none;}
  #profileStats img{position:absolute;-webkit-user-drag:none;}

  /* insights: pinned chrome + inner scroller (CSS sticky fails here because
     body/#app use overflow-x:hidden, which makes sticky a no-op on iOS). */
  #s-insights.active, #s-insights.animating,
  #s-reel.active, #s-reel.animating{
    display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  }
  #insHeader, #reelHeader{flex:0 0 auto;position:relative;z-index:10;background:#0d1115;}
  #insHeader img.insTabImg{display:none;width:100%;}
  #insHeader img.insTabImg.on{display:block;}
  #insScroller, #reelScroller{flex:1 1 auto;min-height:0;overflow-x:hidden;overflow-y:auto;
               -webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:#0d1115;}
  #insContent, #reelContent{position:relative;width:100%;background:#0d1115;}
  #reelHeader img, #reelContent img{display:block;width:100%;}
  /* first Content row (Meow meow) — percents of insights_content_full.png (1290×2334): y 369–570 */
  #reelHot{display:none;left:0;top:15.8%;width:100%;height:8.6%;}
  #c-content.on ~ #reelHot{display:block;}
  #insContent img.insTabImg{display:none;width:100%;}
  #insContent img.insTabImg.on{display:block;}
  #contentShimmer{display:none;position:relative;overflow:hidden;width:100%;}
  #contentShimmer.on{display:block;}
  #contentShimmer img{display:block;width:100%;}
  #contentShimmer::after,#overviewShimmer::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.07) 42%,rgba(255,255,255,.2) 50%,rgba(255,255,255,.07) 58%,rgba(255,255,255,0) 100%);
    background-size:85% 100%;background-repeat:no-repeat;
    -webkit-mask-size:100% 100%;mask-size:100% 100%;
    -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
    animation:insShine 1.4s linear infinite;}
  @keyframes insShine{from{background-position:-85% 0}to{background-position:130% 0}}
  #contentShimmer::after{
    -webkit-mask-image:url(insights_content_shimmer_mask.png?v=71);
    mask-image:url(insights_content_shimmer_mask.png?v=71);}
  #overviewShimmer{display:none;position:relative;overflow:hidden;width:100%;opacity:1;
    transition:opacity .38s ease;}
  #overviewShimmer.on{display:block;}
  #overviewShimmer.cover{position:absolute;left:0;top:0;z-index:5;}
  #overviewShimmer.fade{opacity:0;}
  #overviewShimmer img{display:block;width:100%;}
  #overviewShimmer::after{
    -webkit-mask-image:url(insights_overview_shimmer_mask.png?v=71);
    mask-image:url(insights_overview_shimmer_mask.png?v=71);}
  /* Overview line chart overlay — sits on the painted graph hole in the screenshot.
     Percents are of insights_overview_full.png (1290×4887): y 766–1296. */
  #viewsGraph{position:absolute;left:0;width:100%;top:15.6742%;height:10.8451%;
              z-index:4;pointer-events:none;visibility:hidden;}
  #viewsGraph svg{width:100%;height:100%;display:block;}
  /* Audience follower-growth overlay — hole in insights_audience_full.png (1290×6497): y 880–1280. */
  #followsGraph{position:absolute;left:0;width:100%;top:13.5447%;height:6.1567%;
                z-index:4;pointer-events:none;display:none;visibility:hidden;}
  #followsGraph svg{width:100%;height:100%;display:block;}
  #s-insights.ins-ready #viewsGraph,
  #s-insights.ins-ready #followsGraph{visibility:visible;}
  #insLoading{position:fixed;inset:0;z-index:80;background:#0d1115;display:none;}
  #insLoading img{display:block;width:100%;}

  /* interactions: pinned header (safe-area padding, tiled real-bg strip - the /new1
     pattern) + stitched content + swipe-snap Audience carousel */
  #intHdr{position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top,0px);
          background:#0c1115 url(screens/n_int_hdr_bg.png?v=71) repeat-y;background-size:100% 3px;}
  #intHdr img{display:block;width:100%;}
  /* carousel: two snap stops (Top cities at 0, Top countries at D=1066/1290 of the
     viewport). Drag and release -> the card settles into place; ends clamp. */
  #audSnap{width:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
           -webkit-overflow-scrolling:touch;background:#0c1115;}
  #audTrack{width:182.6357%;display:flex;aspect-ratio:2356/685;
            background:url(screens/n_aud_strip.png?v=71) no-repeat;background-size:100% 100%;}
  #audTrack .sA{width:45.2462%;scroll-snap-align:start;}
  #audTrack .sB{width:54.7538%;scroll-snap-align:start;}
</style>
</head>
<body style="background:#000">
<div id="app">
  <div id="stage">

    <!-- HOME -->
    <div class="screen active" id="s-home">
      <div class="sheet">
        <img src="screens/n_home.png?v=71">
        <div class="hot" style="left:80%;top:89%;width:20%;height:9%" onclick="goProfile()"></div>
      </div>
    </div>

    <!-- PROFILE -->
    <div class="screen navpad" id="s-profile">
      <div class="sheet">
        <img src="screens/n_profile.png?v=71">
        <div class="hot" style="left:3%;top:36%;width:94%;height:7%" onclick="goDashboard()"></div>
      </div>
    </div>

    <!-- DASHBOARD -->
    <div class="screen" id="s-dashboard">
      <div class="sheet">
        <img id="dashImg" src="screens/n_dash.png?v=71">
        <!-- Views row -> insights. This capture has no Interactions row
             (Views / New followers / Content). Extra rows stay unwired. -->
        <div class="hot" style="left:0;top:17.8%;width:100%;height:4.8%" onclick="goInsights()"></div>
      </div>
    </div>

    <!-- INTERACTIONS -->
    <div class="screen navpad" id="s-interactions">
      <div id="intHdr">
        <img src="screens/n_int_header.png?v=71">
        <div class="hot" style="left:0;top:0;width:16%;height:58%" onclick="goBackDash()"></div>
      </div>
      <div class="sheet">
        <img src="screens/n_int_top.png?v=71">
      </div>
      <div id="audSnap">
        <div id="audTrack"><div class="sA"></div><div class="sB"></div></div>
      </div>
      <div style="height:90px;background:#0c1115"></div>
    </div>

    <!-- INSIGHTS -->
    <div class="screen" id="s-insights">
      <div id="insHeader">
        <img id="h-overview" class="insTabImg on" src="insights_overview_header2.png?v=71">
        <img id="h-content" class="insTabImg" alt="">
        <img id="h-audience" class="insTabImg" alt="">
        <div class="hot" style="left:0;top:65%;width:33.3%;height:35%" onclick="insTab('overview')"></div>
        <div class="hot" style="left:33.3%;top:65%;width:33.4%;height:35%" onclick="insTab('content')"></div>
        <div class="hot" style="left:66.7%;top:65%;width:33.3%;height:35%" onclick="insTab('audience')"></div>
      </div>
      <div id="insScroller">
        <div id="insContent">
          <img id="c-overview" class="insTabImg on" src="insights_overview_full.png?v=71">
          <img id="c-content" class="insTabImg" alt="">
          <img id="c-audience" class="insTabImg" alt="">
          <div id="overviewShimmer"><img src="insights_overview_shimmer.png?v=71" alt=""></div>
          <div id="contentShimmer"><img src="insights_content_shimmer.png?v=71" alt=""></div>
          <div id="viewsGraph"></div>
          <div id="followsGraph"></div>
          <div id="reelHot" class="hot" onclick="goReel()"></div>
        </div>
      </div>
    </div>

    <!-- REEL INSIGHTS (Meow meow) -->
    <div class="screen" id="s-reel">
      <div id="reelHeader">
        <img src="insights_reel_header.png?v=71">
        <div class="hot" style="left:0;top:49%;width:18%;height:51%" onclick="goBackInsights()"></div>
      </div>
      <div id="reelScroller">
        <div id="reelContent">
          <img src="insights_reel_full.png?v=71">
        </div>
      </div>
    </div>

  </div>
  <div id="insLoading"><img id="loadImg" src="screens/ins_spinner_c.png?v=71"></div>
</div>
<script>
  // ---- live profile stat numbers (posts/followers/following) ----
  // Values come from config.js (window.STATS); digits are the real harvested
  // glyph images in glyphs/, positioned from glyphmeta.js. Edit config.js +
  // refresh to change them - no rebuild, auto-centered over the labels.
  function renderStats(){
    const meta = window.GLYPH_META, cfg = window.STATS;
    const sheet = document.querySelector('#s-profile .sheet');
    const overlay = document.getElementById('profileStats');
    if (!meta || !cfg || !sheet || !overlay) return;
    const scale = sheet.clientWidth / meta.img_w;   // uniform: aspect preserved
    if (!scale) return;
    overlay.innerHTML = '';
    const cap = meta.capPx * scale;
    const baseline = meta.baselinePx * scale;
    const gap = meta.gapPx * scale;
    const capTop = baseline - cap;
    for (const key in meta.stats){
      const val = String((cfg[key] != null ? cfg[key] : ''));
      const items = [];
      let totalW = 0;
      for (const ch of val){
        const g = meta.glyphs[ch];
        if (!g) continue;
        const w = g.w * scale;
        items.push({ g, w, h: g.h * scale, top: g.top * scale });
        totalW += w;
      }
      if (items.length) totalW += gap * (items.length - 1);
      let x = meta.stats[key].cx * scale - totalW / 2;   // center on label
      for (const it of items){
        const im = document.createElement('img');
        im.src = 'glyphs/' + it.g.file + (window.ASSET_V || '');
        im.style.left = x + 'px';
        im.style.top = (capTop + it.top) + 'px';
        im.style.width = it.w + 'px';
        im.style.height = it.h + 'px';
        overlay.appendChild(im);
        x += it.w + gap;
      }
    }
  }
  window.renderStats = renderStats;
  addEventListener('load', renderStats);
  addEventListener('resize', renderStats);
  if (window.visualViewport) visualViewport.addEventListener('resize', renderStats);
  if (document.readyState !== 'loading') renderStats();

  // hard-disable zoom (iOS ignores user-scalable in some versions)
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('gesturechange', e => e.preventDefault());
  let lastTouch = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTouch <= 300) e.preventDefault();
    lastTouch = now;
  }, { passive: false });

  // html/body started black (inline) so any launch-time gap iOS paints with the
  // page bg is invisible; restore the app tone as soon as the page is up
  addEventListener('load', () => {
    document.documentElement.style.background = '#0d1115';
    document.body.style.background = '#0d1115';
  });

  const ASSET_V = '?v=71';   // bump when any screen image changes (cache-bust mobile)
  const el = id => document.getElementById(id);
  // Flow-model navigation: exactly one screen is .active (in normal flow, so it sets
  // the document height and iOS places the safe areas naturally). Transitions overlay
  // the incoming screen absolutely just for the animation, then it settles into flow.
  let current = 's-home';
  let navBusy = false;           // ignore taps while a transition is in flight
  function go(id, mode){
    if (id === current || navBusy) return;
    navBusy = true;
    const incoming = el(id), outgoing = el(current);
    if (mode === 'back'){        // iOS pop: current screen slides out to the right
      window.scrollTo(0, 0);
      incoming.classList.add('active');            // settles into flow underneath
      outgoing.classList.add('animating');         // overlays on top while leaving
      outgoing.style.transition = 'transform .34s cubic-bezier(.3,.7,.3,1)';
      outgoing.getBoundingClientRect();
      outgoing.style.transform = 'translateX(100%)';
      const doneB = () => {
        outgoing.removeEventListener('transitionend', doneB);
        outgoing.classList.remove('active', 'animating');
        outgoing.style.cssText = '';
        current = id;
        navBusy = false;
        if (id === 's-insights') kickInsScroller();
      };
      outgoing.addEventListener('transitionend', doneB);
      setTimeout(() => { if (current !== id) doneB(); }, 700);
      return;
    }
    if (mode === 'fade'){
      incoming.style.opacity = '0';
      incoming.classList.add('active', 'animating');
      incoming.getBoundingClientRect();
      incoming.style.transition = 'opacity .22s ease';
      incoming.style.opacity = '1';
    } else {                       // slide (iOS push): park off-screen BEFORE paint
      incoming.style.transition = 'none';
      incoming.style.transform = 'translateX(100%)';
      incoming.classList.add('active', 'animating');
      incoming.getBoundingClientRect();
      incoming.style.transition = 'transform .34s cubic-bezier(.3,.7,.3,1)';
      incoming.style.transform = 'translateX(0)';
    }
    const done = () => {
      incoming.removeEventListener('transitionend', done);
      incoming.classList.remove('animating');
      incoming.style.transition = incoming.style.transform = incoming.style.opacity = '';
      if (outgoing !== incoming){ outgoing.classList.remove('active'); outgoing.style.cssText = ''; }
      current = id;
      navBusy = false;
      window.scrollTo(0, 0);
      if (id === 's-insights') kickInsScroller();
      if (id === 's-reel') kickReelScroller();
    };
    incoming.addEventListener('transitionend', done);
    setTimeout(() => { if (current !== id) done(); }, 700);  // safety
  }

  function goProfile(){ go('s-profile', 'fade'); renderStats(); }
  function goDashboard(){
    // dashboard is a plain screenshot now - no skeleton fake-load (old skeleton
    // showed the retired 4-video layout and would flash a mismatched frame)
    go('s-dashboard', 'slide');
  }
  function goInteractions(){
    el('audSnap').scrollLeft = 0;          // always open on Top cities
    go('s-interactions', 'slide');
  }
  function goBackDash(){ go('s-dashboard', 'back'); }
  function goInsights(){
    insOpening = true;
    insTab('overview', true);
    preloadInsTab('audience');
    preloadInsTab('content');
    const sc = el('insScroller'); if (sc) sc.scrollTop = 0;
    el('s-insights').classList.remove('ins-ready');
    el('c-overview').classList.remove('on');
    const sh = el('overviewShimmer');
    sh.classList.add('on');
    sh.classList.remove('fade', 'cover');
    go('s-insights', 'slide');
    setTimeout(() => {
      if (!insOpening) return;
      el('c-overview').classList.add('on');
      sh.classList.add('cover');
      el('s-insights').classList.add('ins-ready');
      requestAnimationFrame(() => { sh.classList.add('fade'); });
      setTimeout(() => {
        sh.classList.remove('on', 'fade', 'cover');
        insOpening = false;
        kickInsScroller();
      }, 400);
    }, 1800);
  }
  function kickInsScroller(){
    const sc = el('insScroller');
    if (!sc) return;
    void sc.offsetHeight;
  }
  function kickReelScroller(){
    const sc = el('reelScroller');
    if (!sc) return;
    sc.scrollTop = 0;
    void sc.offsetHeight;
  }
  function goReel(){
    kickReelScroller();
    go('s-reel', 'slide');
  }
  function goBackInsights(){ go('s-insights', 'back'); }
  const INS_PAGES = {
    overview: ['insights_overview_header2.png', 'insights_overview_full.png'],
    content:  ['insights_content_header2.png',  'insights_content_full.png'],
    audience: ['insights_audience_header2.png', 'insights_audience_full.png'],
  };
  function decodeUrl(url){
    return new Promise(res => {
      const i = new Image();
      i.onload = () => { if (i.decode) i.decode().then(() => res(), () => res()); else res(); };
      i.onerror = res;
      i.src = url;
    });
  }
  function preloadInsTab(p){
    const files = INS_PAGES[p];
    if (!files) return files;
    const hUrl = files[0] + ASSET_V, cUrl = files[1] + ASSET_V;
    const h = el('h-' + p), c = el('c-' + p);
    if (h && !h.getAttribute('src')) h.src = hUrl;
    if (c && !c.getAttribute('src')) c.src = cUrl;
    if (p === 'content'){
      decodeUrl('insights_reel_header.png' + ASSET_V);
      decodeUrl('insights_reel_full.png' + ASSET_V);
    }
    return [hUrl, cUrl];
  }
  let insGen = 0;
  let insPage = 'overview';
  let insOpening = false;
  function insTab(p, silent){
    const urls = preloadInsTab(p);
    if (!urls) return;
    if (!silent && p === insPage && el('h-' + p) && el('h-' + p).classList.contains('on')) return;
    if (!silent){
      insOpening = false;
      const osh = el('overviewShimmer');
      if (osh) osh.classList.remove('on', 'fade', 'cover');
    }
    insPage = p;
    const gen = ++insGen;
    Promise.all(urls.map(decodeUrl)).then(() => {
      if (gen !== insGen) return;
      el('h-overview').classList.toggle('on', p === 'overview');
      el('h-content').classList.toggle('on', p === 'content');
      el('h-audience').classList.toggle('on', p === 'audience');
      el('c-overview').classList.toggle('on', p === 'overview' && !insOpening);
      el('c-audience').classList.toggle('on', p === 'audience');
      const g = el('viewsGraph');
      if (g) g.style.display = p === 'overview' ? 'block' : 'none';
      if (p === 'overview' && !insOpening) drawViewsGraph();
      const fg = el('followsGraph');
      if (fg) fg.style.display = p === 'audience' ? 'block' : 'none';
      if (p === 'audience') drawFollowsGraph();
      const shine = el('contentShimmer');
      const body = el('c-content');
      if (p === 'content'){
        body.classList.remove('on');
        shine.classList.add('on');
        setTimeout(() => {
          if (gen !== insGen) return;
          shine.classList.remove('on');
          body.classList.add('on');
        }, 1800);
      } else {
        shine.classList.remove('on');
        body.classList.remove('on');
      }
      if (!silent) { const sc = el('insScroller'); if (sc) sc.scrollTop = 0; }
      kickInsScroller();
    });
  }

  // Recreate the Insights Overview line chart over the screenshot hole.
  // Geometry copied from the live IG capture (1290-wide overlay viewBox).
  function fmtK(n){
    if (!n) return '0';
    if (n >= 1e6) {
      const m = n / 1e6;
      return (Math.abs(m - Math.round(m)) < 0.05 ? Math.round(m) : m.toFixed(1).replace(/\.0$/, '')) + 'M';
    }
    const k = n / 1000;
    return (Math.abs(k - Math.round(k)) < 0.05 ? Math.round(k) : k.toFixed(1).replace(/\.0$/, '')) + 'K';
  }
  function niceYMax(m){
    const v = Math.max(m, 1);
    if (v >= 1e6) {
      const mil = v / 1e6;
      const steps = [1,1.5,2,2.5,3,4,5,6,8,10,12,15,20,25,30,40,50];
      for (let i = 0; i < steps.length; i++) if (steps[i] >= mil) return steps[i] * 1e6;
      return Math.ceil(mil) * 1e6;
    }
    const k = v / 1000;
    const steps = [1,2,2.5,5,10,15,20,25,30,40,50,60,75,80,100,120,125,150,200,250,500,1000];
    for (let i = 0; i < steps.length; i++) if (steps[i] >= k) return steps[i] * 1000;
    return Math.ceil(k) * 1000;
  }
  function drawViewsGraph(){
    const host = el('viewsGraph');
    const cfg = window.VIEWS_GRAPH;
    if (!host || !cfg || !cfg.values || !cfg.values.length) return;
    const vals = cfg.values.map(Number);
    const ymax = niceYMax(Math.max.apply(null, vals));
    const labelsX = cfg.labelsX || ['', '', ''];
    const L = 150, R = 1190, T = 25, B = 399, DATE_Y = 448;
    const n = vals.length;
    const pts = vals.map((v, i) => {
      const x = L + (n === 1 ? 0 : i * (R - L) / (n - 1));
      const y = B - (Math.max(0, v) / ymax) * (B - T);
      return x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    const yTicks = [ymax, ymax / 2, 0];
    const yPos = [T, (T + B) / 2, B];
    const xPos = [L, (L + R) / 2, R];
    const xAnchor = ['start', 'middle', 'end'];
    let grids = '';
    for (let i = 0; i < 3; i++){
      grids += '<line x1="'+L+'" x2="'+R+'" y1="'+yPos[i]+'" y2="'+yPos[i]+'" stroke="#24292e" stroke-width="3"/>';
    }
    let yLabs = '';
    for (let i = 0; i < 3; i++){
      yLabs += '<text x="140" y="'+yPos[i]+'" text-anchor="end" dominant-baseline="middle" fill="#9ba4af" font-size="30" font-family="-apple-system,\'SF Pro Text\',sans-serif">'+fmtK(yTicks[i])+'</text>';
    }
    let xLabs = '';
    for (let i = 0; i < 3; i++){
      xLabs += '<text x="'+xPos[i]+'" y="'+DATE_Y+'" text-anchor="'+xAnchor[i]+'" fill="#9ba4af" font-size="30" font-family="-apple-system,\'SF Pro Text\',sans-serif">'+labelsX[i]+'</text>';
    }
    host.innerHTML = '<svg viewBox="0 0 1290 530" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">'+
      grids + yLabs + xLabs +
      '<polyline fill="none" stroke="#dc38d1" stroke-width="11" stroke-linejoin="round" stroke-linecap="round" points="'+pts+'"/>'+
      '</svg>';
  }
  function drawFollowsGraph(){
    const host = el('followsGraph');
    const cfg = window.FOLLOWS_GRAPH;
    if (!host || !cfg || !cfg.values || !cfg.values.length) return;
    const vals = cfg.values.map(Number);
    const ymin = cfg.yMin != null ? Number(cfg.yMin) : -20000;
    const ymax = cfg.yMax != null ? Number(cfg.yMax) : 20000;
    const span = ymax - ymin || 1;
    const labelsX = cfg.labelsX || ['', '', ''];
    const L = 150, R = 1190, T = 22, B = 338, DATE_Y = 378;
    const n = vals.length;
    const pts = vals.map((v, i) => {
      const x = L + (n === 1 ? 0 : i * (R - L) / (n - 1));
      const y = B - ((v - ymin) / span) * (B - T);
      return x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    const yTicks = [ymax, 0, ymin];
    const yPos = [T, (T + B) / 2, B];
    const xPos = [L, (L + R) / 2, R];
    const xAnchor = ['start', 'middle', 'end'];
    let grids = '';
    for (let i = 0; i < 3; i++){
      grids += '<line x1="'+L+'" x2="'+R+'" y1="'+yPos[i]+'" y2="'+yPos[i]+'" stroke="#24292e" stroke-width="3"/>';
    }
    let yLabs = '';
    for (let i = 0; i < 3; i++){
      yLabs += '<text x="140" y="'+yPos[i]+'" text-anchor="end" dominant-baseline="middle" fill="#9ba4af" font-size="30" font-family="-apple-system,\'SF Pro Text\',sans-serif">'+fmtK(yTicks[i])+'</text>';
    }
    let xLabs = '';
    for (let i = 0; i < 3; i++){
      xLabs += '<text x="'+xPos[i]+'" y="'+DATE_Y+'" text-anchor="'+xAnchor[i]+'" fill="#9ba4af" font-size="30" font-family="-apple-system,\'SF Pro Text\',sans-serif">'+labelsX[i]+'</text>';
    }
    host.innerHTML = '<svg viewBox="0 0 1290 400" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">'+
      grids + yLabs + xLabs +
      '<polyline fill="none" stroke="#dc38d1" stroke-width="11" stroke-linejoin="round" stroke-linecap="round" points="'+pts+'"/>'+
      '</svg>';
  }
  addEventListener('load', drawViewsGraph);
</script>
