<!doctype html>
<!-- html/body start BLACK (inline, so it holds from the very first paint): during
     PWA launch iOS paints the page background in areas no element covers yet (the
     gray strip under the home indicator). Black = invisible against the splash.
     The splash-removal script restores the app tone afterwards. -->
<html lang="en" style="background:#000">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest_new.json?v=87">
<link rel="apple-touch-icon" href="icon.png?v=87">
<!-- native iOS launch images: iOS shows these INSTANTLY on tap (before our HTML
     loads), killing the system gray phase. Pixel-identical to the in-page splash. -->
<link rel="apple-touch-startup-image" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="launch_1290x2796.png?v=87">
<link rel="apple-touch-startup-image" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="launch_1179x2556.png?v=87">
<title>Instagram</title>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update());
  // deploy landed while we were serving the cached shell: reload silently, but only
  // in the first moment after open (reload serves instantly from cache; no loop -
  // the reloaded copy matches the network so no second notification fires)
  navigator.serviceWorker.addEventListener('message',(e)=>{
    if(e.data&&e.data.type==='shell-updated'&&performance.now()<1200)location.reload();
  });
}
</script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    scrollbar-width:none;-ms-overflow-style:none;}
  ::-webkit-scrollbar{display:none;width:0;height:0;}   /* IG never shows scrollbars */
  /* NORMAL-FLOW document (the working-reference pattern): min-height:100dvh, the page
     flows; we do NOT lock with position:fixed/height:100dvh/overflow:hidden (that was
     fighting iOS's safe-area placement and leaving the on-device bottom gap). */
  html{background:#0d1115;-webkit-text-size-adjust:100%;}
  body{background:#0d1115;min-height:100dvh;overflow-x:hidden;
       font-family:-apple-system,"SF Pro Text",sans-serif;touch-action:manipulation;}
  img,video{-webkit-user-drag:none;}
  #app{position:relative;min-height:100dvh;background:#0d1115;overflow-x:hidden;}
  #stage{position:relative;min-height:100dvh;background:#0d1115;}

  /* one screen visible at a time; the active screen flows (sets the document height) */
  .screen{display:none;width:100%;background:#0d1115;position:relative;}
  .screen.active{display:block;}
  .screen.animating{position:absolute;top:0;left:0;z-index:50;}  /* only during a transition */
  /* nav screens reserve the home-indicator zone (dark) below the nav, like the
     reference's env(safe-area-inset-bottom) padding -> nav clears the indicator */
  .screen.navpad{padding-bottom:env(safe-area-inset-bottom,0px);}

  .sheet{position:relative;width:100%;}
  .sheet > img{display:block;width:100%;height:auto;position:relative;z-index:1;}
  .hot{position:absolute;background:transparent;z-index:5;}

  /* dashboard + reel: pinned header + inner scroller (CSS sticky fails here because
     body/#app use overflow-x:hidden, which makes sticky a no-op on iOS). The header
     images already include the painted 177px status band - no extra safe-area pad. */
  #s-dash.active, #s-dash.animating,
  #s-reel.active, #s-reel.animating{
    display:flex;flex-direction:column;height:100dvh;overflow:hidden;background:#0b1014;
  }
  .pinHead{flex:0 0 auto;position:relative;z-index:10;background:#0b1014;}
  .scroller{flex:1 1 auto;min-height:0;overflow-x:hidden;overflow-y:auto;
            -webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:#0b1014;}
  .pinHead img, .scroller img{display:block;width:100%;}
  .pinHead img.tabImg{display:none;}
  .pinHead img.tabImg.on{display:block;}
  .tabBody{display:none;position:relative;}
  .tabBody.on{display:block;}
</style>
</head>
<body style="background:#000">
<div id="app">
  <div id="stage">

    <!-- HOME -->
    <div class="screen active" id="s-home">
      <div class="sheet">
        <img src="screens/n_home.png?v=87">
        <div class="hot" style="left:80%;top:89%;width:20%;height:9%" onclick="goProfile()"></div>
      </div>
    </div>

    <!-- PROFILE -->
    <div class="screen navpad" id="s-profile">
      <div class="sheet">
        <img src="v2/profile.png?v=87">
        <!-- "Your dashboard" card, v2/profile.png (1290x2796): y 987-1154 -->
        <div class="hot" style="left:3%;top:35%;width:94%;height:6.6%" onclick="goDash()"></div>
      </div>
    </div>

    <!-- YOUR DASHBOARD: Home / Performance / Content / Audience -->
    <div class="screen" id="s-dash">
      <div class="pinHead">
        <img id="dh-home" class="tabImg on" src="v2/dash_h_home.png?v=87">
        <img id="dh-perf" class="tabImg" src="v2/dash_h_perf.png?v=87">
        <img id="dh-content" class="tabImg" src="v2/dash_h_content.png?v=87">
        <img id="dh-aud" class="tabImg" src="v2/dash_h_aud.png?v=87">
        <!-- header 1290x473: back button y 174-306, tabs row y 360-473 -->
        <div class="hot" style="left:0;top:34%;width:17%;height:34%" onclick="go('s-profile','back')"></div>
        <div class="hot" style="left:0;top:74%;width:25%;height:26%" onclick="dashTab('home')"></div>
        <div class="hot" style="left:25%;top:74%;width:25%;height:26%" onclick="dashTab('perf')"></div>
        <div class="hot" style="left:50%;top:74%;width:25%;height:26%" onclick="dashTab('content')"></div>
        <div class="hot" style="left:75%;top:74%;width:25%;height:26%" onclick="dashTab('aud')"></div>
      </div>
      <div class="scroller" id="dashScroller">
        <div id="db-home" class="tabBody on">
          <img src="v2/dash_b_home.png?v=87">
          <!-- Views card, body 1290x2323: x 50-620, y 198-815 -->
          <div class="hot" style="left:3.5%;top:8.3%;width:45%;height:27%" onclick="dashTab('perf')"></div>
        </div>
        <div id="db-perf" class="tabBody"><img src="v2/dash_b_perf.png?v=87"></div>
        <div id="db-content" class="tabBody">
          <img src="v2/dash_b_content.png?v=87">
          <!-- reel rows, body 1290x2323: row 1 y 387-603, pitch 217 -->
          <div class="hot" style="left:0;top:16.66%;width:100%;height:9.3%" onclick="goReel(1)"></div>
        </div>
        <div id="db-aud" class="tabBody"><img src="v2/dash_b_aud.png?v=87"></div>
      </div>
    </div>

    <!-- REEL 1 INSIGHTS -->
    <div class="screen" id="s-reel">
      <div class="pinHead">
        <img src="v2/reel1_h.png?v=87">
        <!-- header 1290x350: back button y 174-306 -->
        <div class="hot" style="left:0;top:46%;width:17%;height:45%" onclick="go('s-dash','back')"></div>
      </div>
      <div class="scroller" id="reelScroller">
        <div id="r-ov" class="tabBody on">
          <img src="v2/reel1_ov.png?v=87">
          <!-- tabs row, body 1290x2446: y 730-845; Audience x 858-1290 -->
          <div class="hot" style="left:66.5%;top:29.8%;width:33.5%;height:4.7%" onclick="reelTab('aud')"></div>
        </div>
        <div id="r-aud" class="tabBody">
          <div style="position:relative">
            <img id="raTop" src="v2/reel1_aud_top.png?v=87">
            <!-- tabs row, 1290x1474: y 730-845; Overview x 0-428 -->
            <div class="hot" style="left:0;top:49.5%;width:33.2%;height:7.8%" onclick="reelTab('ov')"></div>
          </div>
          <div style="position:relative">
            <img id="raAge" src="v2/reel1_aud_age.png?v=87">
            <img id="raCty" src="v2/reel1_aud_cty.png?v=87" style="display:none">
            <img id="raGen" src="v2/reel1_aud_gen.png?v=87" style="display:none">
            <!-- pills sit 40-154px below the top of every swap image (1290-wide) -->
            <div class="hot" style="left:3%;top:2.5vw;width:14%;height:10vw" onclick="raSel('age')"></div>
            <div class="hot" style="left:17.6%;top:2.5vw;width:19.4%;height:10vw" onclick="raSel('cty')"></div>
            <div class="hot" style="left:37.6%;top:2.5vw;width:18.6%;height:10vw" onclick="raSel('gen')"></div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
<script>
  // hard-disable zoom (iOS ignores user-scalable in some versions)
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('gesturechange', e => e.preventDefault());
  let lastTouch = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTouch <= 300) e.preventDefault();
    lastTouch = now;
  }, { passive: false });

  // html/body started black (inline) so any launch-time gap iOS paints with the
  // page bg is invisible; restore the app tone as soon as the page is up
  addEventListener('load', () => {
    document.documentElement.style.background = '#0d1115';
    document.body.style.background = '#0d1115';
  });

  const ASSET_V = '?v=87';   // bump when any screen image changes (cache-bust mobile)
  const el = id => document.getElementById(id);
  // Flow-model navigation: exactly one screen is .active (in normal flow, so it sets
  // the document height and iOS places the safe areas naturally). Transitions overlay
  // the incoming screen absolutely just for the animation, then it settles into flow.
  let current = 's-home';
  let navBusy = false;           // ignore taps while a transition is in flight
  function go(id, mode){
    if (id === current || navBusy) return;
    navBusy = true;
    const incoming = el(id), outgoing = el(current);
    if (mode === 'back'){        // iOS pop: current screen slides out to the right
      window.scrollTo(0, 0);
      incoming.classList.add('active');            // settles into flow underneath
      outgoing.classList.add('animating');         // overlays on top while leaving
      outgoing.style.transition = 'transform .34s cubic-bezier(.3,.7,.3,1)';
      outgoing.getBoundingClientRect();
      outgoing.style.transform = 'translateX(100%)';
      const doneB = () => {
        outgoing.removeEventListener('transitionend', doneB);
        outgoing.classList.remove('active', 'animating');
        outgoing.style.cssText = '';
        current = id;
        navBusy = false;
      };
      outgoing.addEventListener('transitionend', doneB);
      setTimeout(() => { if (current !== id) doneB(); }, 700);
      return;
    }
    if (mode === 'fade'){
      incoming.style.opacity = '0';
      incoming.classList.add('active', 'animating');
      incoming.getBoundingClientRect();
      incoming.style.transition = 'opacity .22s ease';
      incoming.style.opacity = '1';
    } else {                       // slide (iOS push): park off-screen BEFORE paint
      incoming.style.transition = 'none';
      incoming.style.transform = 'translateX(100%)';
      incoming.classList.add('active', 'animating');
      incoming.getBoundingClientRect();
      incoming.style.transition = 'transform .34s cubic-bezier(.3,.7,.3,1)';
      incoming.style.transform = 'translateX(0)';
    }
    const done = () => {
      incoming.removeEventListener('transitionend', done);
      incoming.classList.remove('animating');
      incoming.style.transition = incoming.style.transform = incoming.style.opacity = '';
      if (outgoing !== incoming){ outgoing.classList.remove('active'); outgoing.style.cssText = ''; }
      current = id;
      navBusy = false;
      window.scrollTo(0, 0);
    };
    incoming.addEventListener('transitionend', done);
    setTimeout(() => { if (current !== id) done(); }, 700);  // safety
  }

  // Decode the images that are about to become visible BEFORE swapping, else the
  // browser paints a not-yet-decoded (blank/dark) frame - the "black flash".
  function swapAfterDecode(imgs, apply){
    const jobs = imgs.filter(Boolean).map(i => (i.decode ? i.decode().catch(() => {}) : Promise.resolve()));
    Promise.all(jobs).then(apply, apply);
  }
  function decodeUrl(url){
    return new Promise(res => {
      const i = new Image();
      i.onload = () => { if (i.decode) i.decode().then(() => res(), () => res()); else res(); };
      i.onerror = res;
      i.src = url;
    });
  }

  function goProfile(){
    go('s-profile', 'fade');
    ['dash_h_home', 'dash_b_home'].forEach(f => decodeUrl('v2/' + f + '.png' + ASSET_V));
  }

  // ---- Your dashboard ----
  const DASH_TABS = ['home', 'perf', 'content', 'aud'];
  let dashCur = 'home';
  function dashTab(t, force){
    if (t === dashCur && !force) return;
    swapAfterDecode([el('dh-' + t), el('db-' + t).querySelector('img')], () => {
      DASH_TABS.forEach(x => {
        el('dh-' + x).classList.toggle('on', x === t);
        el('db-' + x).classList.toggle('on', x === t);
      });
      dashCur = t;
      el('dashScroller').scrollTop = 0;
    });
  }
  function goDash(){
    dashTab('home', true);
    go('s-dash', 'slide');
    // warm everything reachable from here so tab taps are instant
    ['dash_h_perf', 'dash_b_perf', 'dash_h_content', 'dash_b_content', 'dash_h_aud', 'dash_b_aud',
     'reel1_h', 'reel1_ov', 'reel1_aud_top', 'reel1_aud_age', 'reel1_aud_cty', 'reel1_aud_gen']
      .forEach(f => decodeUrl('v2/' + f + '.png' + ASSET_V));
  }

  // ---- Reel insights (row N of Content) ----
  function goReel(n){
    if (n !== 1) return;
    reelTab('ov', true);
    raSel('age');
    el('reelScroller').scrollTop = 0;
    go('s-reel', 'slide');
  }
  function reelTab(t, force){
    const body = el(t === 'aud' ? 'r-aud' : 'r-ov');
    if (body.classList.contains('on') && !force) return;
    const imgs = [...body.querySelectorAll('img')].filter(i => i.style.display !== 'none');
    swapAfterDecode(imgs, () => {
      el('r-ov').classList.toggle('on', t === 'ov');
      el('r-aud').classList.toggle('on', t === 'aud');
    });
  }
  // Age / Country / Gender: only the list under the pills swaps; the top stays put
  function raSel(w){
    const ids = { age: 'raAge', cty: 'raCty', gen: 'raGen' };
    swapAfterDecode([el(ids[w])], () => {
      for (const k in ids) el(ids[k]).style.display = k === w ? 'block' : 'none';
    });
  }
</script>
</body>
</html>
